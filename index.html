:root{--sp-Football:#3ddc84;--sp-Basketball:#ff8a3d;--sp-Tennis:#cde85a;--sp-NFL:#6aa8ff;--sp-Olympics:#ffd166;--sp-Mixed:#c792ea;--bg:#07090d;--panel:#10141b;--panel2:#151b24;--text:#f4f6f8;--muted:#9aa5b4;--line:#27303d;--green:#23d18b;--red:#ff5364;--gold:#ffd166;--blue:#8dc8ff;
  --font:"Rubik","Segoe UI","Noto Sans Hebrew","Arial Hebrew",system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-weight:400;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
button,input{font-family:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,#1f2a3d 0,transparent 38%),repeating-linear-gradient(0deg,transparent 0 59px,#ffffff05 60px);opacity:.75;z-index:-1}
.shell{min-height:100vh;min-height:100dvh;position:relative}
.wrap{width:min(1100px,calc(100% - 32px));margin:auto}
.home .wrap{padding:28px 0 48px}
.langbar{display:flex;gap:6px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.langbar .langs,.langbar .settings{display:flex;gap:6px;flex-wrap:wrap}
.settings .btn{font-size:14px}
.langbar .btn{padding:8px 14px;min-height:40px;font-weight:500}
.langbar .btn.on{border-color:var(--green);color:var(--green)}
.eyebrow{font-weight:700;color:var(--green);font-size:13px;letter-spacing:.06em}
.title{font-size:clamp(44px,9vw,108px);line-height:.92;letter-spacing:-.035em;margin:14px 0 18px;font-weight:800}
.title span{display:block;color:transparent;-webkit-text-stroke:1.5px #8592a3}
.tag{font-size:clamp(17px,2vw,24px);max-width:720px;color:#c8ced7;font-weight:500;margin:0}
.h1{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
h2{font-weight:700;font-size:20px;margin:30px 0 12px}
.home .rank-guide summary,.home .participants summary{font-weight:600}
.cta{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:#161c25;color:var(--text);border-radius:10px;padding:13px 18px;font-weight:600;font-size:15px;cursor:pointer;min-height:46px;line-height:1.2}
.btn:hover:not([disabled]){border-color:#718096}
.btn:focus-visible,.choice:focus-visible,.mode:focus-visible,.sport:focus-visible,.dot:focus-visible,.profilechip:focus-visible,.feedback:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--green);color:#04120c;border-color:var(--green);font-weight:700}
.btn.danger{background:var(--red);border-color:var(--red);color:#1a0306;font-weight:700}
.btn.big{padding:15px 26px;font-size:17px}
.subtle{color:var(--muted)}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:40px}
.home-results{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini{background:#0d1118cc;border:1px solid var(--line);padding:14px 16px;border-radius:12px;min-width:0}
.mini span{color:var(--muted);font-size:13px;font-weight:500;display:block}
.mini b{font-size:26px;display:block;font-variant-numeric:tabular-nums;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.metric-help{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:6px}
.history .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.history table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.history th,.history td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
.history th{color:var(--muted);font-weight:500}
.history tr:last-child td{border-bottom:0}
.up{color:var(--green)}.down{color:var(--red)}
.rank-guide,.participants{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#0b1017}
.rank-guide summary{cursor:pointer;font-weight:600}
.rank-guide p,.participants p{line-height:1.55;color:#b9c2ce}
.rank-scale{display:flex;gap:7px;flex-wrap:wrap}
.rank-scale span{border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:500}
.participants h3{margin:0 0 4px;font-weight:600;font-size:16px}
.participant-list{display:flex;gap:8px;flex-wrap:wrap}
.profilebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:26px}
.profilechip{border:1px solid var(--line);background:#0e131b;color:var(--text);border-radius:999px;padding:9px 14px;cursor:pointer;font-size:14px;min-height:40px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profilechip.active{border-color:var(--green);background:#10221c}
.profileform{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.profileform input{background:#0d1118;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;min-width:220px;font-size:16px}
.footer-note{color:#6d7886;font-size:12px;margin-top:30px}
.screen{padding:20px 0 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:22px}
.brand{font-weight:700}
.top-actions{display:flex;gap:10px;align-items:center}
.live{color:var(--red);font-size:13px;font-weight:600}
.scoreline{display:flex;gap:16px;font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted)}
.scoreline b{color:var(--text)}
#lives{color:var(--red);letter-spacing:.1em}
.modecards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.mode{appearance:none;width:100%;text-align:start;color:var(--text);font:inherit;background:#0e131b;border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;transition:.15s border-color,.15s background}
.mode:hover{border-color:#687585}
.mode.sel,.sport.sel{border-color:var(--green);background:#10221c;box-shadow:inset 0 0 0 1px #23d18b55}
.mode h3{margin:0 0 6px;font-weight:700;font-size:18px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.sports{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sport{padding:16px;border:1px solid var(--line);background:#0e131b;color:var(--text);border-radius:12px;cursor:pointer;font-weight:600;font-size:16px;min-height:52px}
.sport[disabled]{opacity:.35;cursor:not-allowed}
.notice{color:var(--gold);margin-top:14px}
.small{font-size:13px}
.install{margin-top:14px;padding:14px 16px;border:1px solid #8dc8ff55;border-radius:14px;background:#0d1520;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.install p{margin:0;color:#c8ced7;line-height:1.5}
.newbie .home-results,.newbie .history{display:none}
.daily{margin-top:22px;padding:18px;border:1px solid #ffd16655;border-radius:14px;background:linear-gradient(135deg,#1d1a0f,#0e131b 60%)}
.daily-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.daily-tag{font-weight:700;color:var(--gold);font-size:17px}
.daily-streak{font-weight:600;color:#ffb48a}
.daily p{color:#c8ced7;line-height:1.5;margin:10px 0 14px}
.daily .daily-done{color:var(--text);font-weight:600;margin-bottom:6px}
.marks{font-size:22px;letter-spacing:2px;margin:6px 0 12px;text-align:start}
[dir=rtl] .marks{text-align:end}
.share-row{display:flex;gap:10px;flex-wrap:wrap}
.btn.share{background:#1f8f57;border-color:#1f8f57;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.share-card{margin:6px 0 18px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#0e131b}
.share-card h2{margin:0 0 4px;font-size:17px}
.sport .ico{font-size:18px}
.sport.sel{border-color:var(--sp);box-shadow:inset 0 0 0 1px var(--sp)}
.pill.sp{border-color:var(--sp);color:var(--sp);font-weight:600}
.game .qhead{border-inline-start:4px solid var(--sp);padding-inline-start:16px}
.scorebox{position:relative}
.gain{position:absolute;inset-inline-end:-6px;top:-18px;color:var(--green);font-weight:800;font-size:15px;animation:gain 1.1s both;pointer-events:none}
@keyframes gain{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.track{display:flex;gap:4px;margin-top:22px}
.track i{flex:1;height:6px;border-radius:9px;background:#202733}
.track.open i{flex:0 0 18px}
.track i.ok{background:var(--green)}.track i.no{background:var(--red)}.track i.now{background:#56637a}
.burst{position:fixed;left:50%;top:30%;width:0;height:0;z-index:9;pointer-events:none}
.burst i{position:absolute;width:9px;height:14px;border-radius:2px;animation:burst 1s cubic-bezier(.2,.7,.3,1) both}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 120px)) rotate(var(--rot));opacity:0}}
.pop-in{animation:popin .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.select .cta{position:sticky;bottom:0;z-index:2;margin-top:18px;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#07090d00,var(--bg) 35%)}
.data-tools .cta{margin-top:14px}
.report{display:inline-block;margin-top:12px;color:var(--muted);font-size:13px}
.review .report{margin-inline-start:18px}
.count{display:grid;place-items:center;font-size:clamp(80px,18vw,200px);font-weight:800}
.corner{position:absolute;top:16px;inset-inline-start:16px;font-size:15px}
.qhead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.qmain{flex:1;min-width:0}
.qmeta{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500;color:#c3cbd5}
.diff-SICKO{border-color:#ff536488;color:#ff9aa5}.diff-EXPERT{border-color:#ffd16688;color:#ffe2a0}
.question{font-size:clamp(24px,3.6vw,42px);line-height:1.18;letter-spacing:-.015em;margin:18px 0 24px;font-weight:600;overflow-wrap:anywhere}
.timer{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:conic-gradient(var(--green) var(--p),#252d38 0);position:relative}
.timer:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.timer b{z-index:1;font-size:30px;font-variant-numeric:tabular-nums;font-weight:700}
.timer.warn{background:conic-gradient(var(--gold) var(--p),#252d38 0)}
.timer.crit{background:conic-gradient(var(--red) var(--p),#252d38 0);animation:pulse .7s infinite alternate}
.timer.off{background:#252d38}.timer.off b{font-size:16px;color:var(--muted)}
@keyframes pulse{to{transform:scale(1.04)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,#151b24,#10141b);border:1px solid var(--line);padding:18px 20px;border-radius:14px;cursor:pointer;text-align:start;color:var(--text);font-size:17px;font-weight:500;min-height:76px;transition:.15s border-color}
.choice .key{flex:0 0 28px;height:28px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:600}
.choice:hover:not([disabled]){border-color:#6a7584}
.choice[disabled]{cursor:default}
.choice.gone{visibility:hidden}
.choice.correct{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);background:#0f2a1f}
.choice.wrong{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:#2a1014}
.openrow{display:flex;gap:10px}
.openrow input{flex:1;background:#0d1118;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:16px;font-size:18px;min-width:0}
.feedback{margin-top:16px;padding:18px;border:1px solid var(--line);border-radius:12px;background:#0d1118;cursor:pointer}
.feedback.good{border-color:#23d18b88}.feedback.bad{border-color:#ff536488}
.feedback strong{font-size:22px;font-weight:700}
.feedback p{color:#d0d6de;margin:8px 0 0;line-height:1.6;font-size:16px}
.feedback .advance{margin-top:12px;color:var(--muted);font-size:13px}
.lifelines{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.life{font-size:14px;padding:10px 14px;min-height:42px}
.life.used{opacity:.85;color:var(--gold);border-color:#ffd16655}
.results-hero{text-align:center;padding:30px 0 22px}
.results-hero .big{font-size:clamp(64px,12vw,130px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.newbest{color:var(--gold);font-weight:700;margin-top:6px}
.rank{color:var(--green);font-weight:600;font-size:18px;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.timeline{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
.dot{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:#0e131b;color:var(--text);display:grid;place-items:center;font-weight:600;cursor:pointer}
.dot.ok{border-color:#23d18b88}.dot.no{border-color:#ff536488}.dot.cur{background:#1b2431}
.review{background:#0e131b;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:8px}
.review h3{font-weight:600;line-height:1.35}
.review p{line-height:1.55}
.review a{color:var(--blue)}
.streakpop{position:fixed;top:18%;left:50%;transform:translateX(-50%);font-size:clamp(30px,6vw,64px);font-weight:800;z-index:9;animation:pop .9s both;pointer-events:none;text-align:center;text-shadow:0 6px 30px #000;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}35%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-10px)}}
.modal-backdrop{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:440px;width:100%}
.modal h2{margin:0 0 8px}.modal p{color:#c8ced7;line-height:1.55;margin:0}
.modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
@media(max-width:760px){
  .stats-strip,.home-results,.cards{grid-template-columns:repeat(2,1fr)}
  .modecards,.sports{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr}
  .qhead{flex-direction:row-reverse;align-items:flex-start}
  [dir=rtl] .qhead{flex-direction:row-reverse}
  .timer{width:64px;height:64px}.timer:after{inset:6px}.timer b{font-size:21px}
  .question{margin:12px 0 18px}
  .choice{min-height:58px;padding:14px 16px;font-size:16px}
}
@media(max-width:520px){
  .wrap{width:calc(100% - 32px)}
  .mode{padding:14px}.mode h3{font-size:16px;margin-bottom:4px}.mode p{font-size:13px}
  .mini{padding:12px}.mini b{font-size:21px}
  .metric-help{display:none}
  .profileform input{min-width:0;flex:1}
  .cta .btn{flex:1 1 100%}
  .openrow{flex-direction:column}
  .topbar{flex-wrap:wrap}
  .scoreline{gap:12px;font-size:14px}
  .live{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:4, והבטיח את אליפותו הרביעית."},"source":"https://en.wikipedia.org/wiki/2022_NBA_Finals","status":"active"},{"id":"vb35","sport":"Basketball","type":"mc","entity":"player","difficulty":"EASY","rating":1360,"time":16,"q":{"en":"Who was the 2023 NBA Finals MVP?","he":"מי היה ה-MVP של סדרת הגמר ב-NBA בשנת 2023?"},"answer":{"en":"Nikola Jokić","he":"ניקולה יוקיץ׳"},"distractors":[{"en":"Jamal Murray","he":"ג׳מאל מארי"},{"en":"Jimmy Butler","he":"ג׳ימי באטלר"},{"en":"Bam Adebayo","he":"באם אדבאיו"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Jokić, the 41st pick of the 2014 draft, led Denver past Miami 4-1 and in Game 3 became the first player with 30 points, 20 rebounds and 10 assists in a Finals game.","he":"יוקיץ׳, הבחירה ה-41 בדראפט 2014, הוביל את דנבר לניצחון 1:4 על מיאמי, ובמשחק השלישי הפך לשחקן הראשון שרשם 30 נקודות, 20 ריבאונדים ו-10 אסיסטים במשחק גמר."},"source":"https://en.wikipedia.org/wiki/2023_NBA_Finals","status":"active"},{"id":"hb1","sport":"Basketball","type":"mc","entity":"player","difficulty":"EXPERT","rating":1900,"time":17,"q":{"en":"In the June 2007 draft-night trade that sent Ray Allen to the Boston Celtics, whose draft rights (the No. 5 pick) did Boston give to the Seattle SuperSonics?","he":"בטרייד של ליל הדראפט ביוני 2007 שהעביר את ריי אלן לבוסטון סלטיקס, את זכויות הדראפט של מי (הבחירה החמישית) מסרה בוסטון לסיאטל סופרסוניקס?"},"answer":{"en":"Jeff Green","he":"ג׳ף גרין"},"distractors":[{"en":"Mike Conley","he":"מייק קונלי"},{"en":"Yi Jianlian","he":"יי ג׳יאנליאן"},{"en":"Corey Brewer","he":"קורי ברואר"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Seattle also received Delonte West and Wally Szczerbiak, while Boston got Allen plus the rights to No. 35 pick Glen Davis; the Sonics had taken Kevin Durant second overall that same night.","he":"סיאטל קיבלה גם את דלונטה ווסט ואת וולי שצ׳רביאק, ובוסטון קיבלה את אלן ואת זכויות הבחירה ה-35, גלן דייוויס; באותו ערב בחרו הסוניקס בקווין דוראנט במקום השני."},"source":"https://en.wikipedia.org/wiki ו ולמדינתו תואר שלישי."},"source":"https://www.fifa.com/en/tournaments/mens/worldcup","status":"active"},{"id":"vf11","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1500,"time":16,"q":{"en":"Which nation lost the 2006 World Cup final on penalties?","he":"איזו נבחרת הפסידה בגמר מונדיאל 2006 בדו־קרב פנדלים?"},"answer":{"en":"France","he":"צרפת"},"distractors":[{"en":"Germany","he":"גרמניה"},{"en":"Portugal","he":"פורטוגל"},{"en":"Brazil","he":"ברזיל"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"It was Zinedine Zidane’s final match: he scored an early penalty but was sent off in extra time for headbutting Marco Materazzi, and David Trezeguet hit the bar in the shoot-out.","he":"זה היה המשחק האחרון של זינדין זידאן: הוא כבש בפנדל מוקדם אך הורחק בהארכה אחרי נגיחה במרקו מטראצי, ודויד טרזגה פגע במשקוף בדו־קרב הפנדלים."},"source":"https://www.fifa.com/en/tournaments/mens/worldcup","status":"active"},{"id":"vf12","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1500,"time":16,"q":{"en":"Which nation did Spain beat in the 2010 World Cup final?","he":"על איזו נבחרת גברה ספרד בגמר מונדיאל 2010?"},"answer":{"en":"Netherlands","he":"הולנד"},"distractors":[{"en":"Germany","he":"גרמניה"},{"en":"Uruguay","he":"אורוגוואי"},{"en":"Portugal","he":"פורטוגל"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"It was the Netherlands’ third lost World Cup final after 1974 and 1978; Arjen Robben was denied one-on-one by Iker Casillas and John Heitinga was sent off in extra time.","he":"זה היה הגמר העולמי השלישי שהולנד הפסידה, אחרי 1974 ו־1978; אריין רובן נעצר במצב אחד על אחד מול איקר קסיאס, וג׳ון הייטינחה הורחק בהארכה."},"source":"https://www.fifa.com/en/tournaments/mens/worldcup","status":"active"},{"id":"vf13","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1500,"time":16,"q":{"en":"Which nation did Germany beat in the 2014 World Cup final?","he":"על איזו נבחרת גברה גרמניה בגמר מונדיאל 2014?"},"answer":{"en":"Argentina","he":"ארגנטינה"},"distractors":[{"en":"Brazil","he":"ברזיל"},{"en":"Netherlands","he":"הולנד"},{"en":"Belgium","he":"בלגיה"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Argentina had reached the final by beating the Netherlands on penalties in the semi-final, and Lionel Messi received the Golden Ball despite the defeat.","he":"ארגנטינה העפילה לגמר אחרי ניצחון בפנדלים על הולנד בחצי הגמר, וליונל מסי קיבל את כדור הזהב למרות ההפסד."},"source":"https://www.fifa.com/en/tournaments/mens/worldcup","status":"active"},{"id":"vf14","sport":"Football","type":"mc","entity":"national_team","difficulty":"EASY","rating":1360,"time":16,"q":{"en":"Which nation did France beat in the 2018 World Cup final?","he":"על איזו נבחרת גברה צרפת בגמר מונדיאל 2018?"},"answer":{"en":"Croatia","he":"קרואטיה"},"distractors":[{"en":"Belgium","he":"בלגיה"},{"en":"England","he":"אנגליה"},{"en":"Uruguay","he":"אורוגוואי"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"It was Croatia’s first World Cup final; they had come through extra time in all three knockout rounds before the final, and Luka Modrić won the Golden Ball.","he":"זה היה הגמר העולמי הראשון של קרואטיה; בכל שלושת סיבובי הנוקאאוט שלפני הגמר היא נזקקה להארכה, ולוקה מודריץ׳ זכה בכדור הזהב."},"source":"https://www.fifa.com/en/tournaments/mens/worldcup","status":"active"},{"id":"vf15","sport":"Football","type":"mc","entity":"national_team","difficulty":"EASY","rating":1300,"time":16,"q":{"en":"Which nation did Argentina beat in the 2022 World Cup final?","he":"על איזו נבחרת גברה ארגנטינה בגמר מונדיאל 2022?"},"answer":{"en":"France","he":"צרפת"},"distractors":[{"en":"Croatia","he":"קרואטיה"},{"en":"Morocco","he":"מרוקו"},{"en":"Brazil","he":"ברזיל"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Kylian Mbappé scored a hat-trick for the beaten French side, the first in a men’s World Cup final since Geoff Hurst for England in 1966.","he":"קיליאן אמבפה כבש שלושער בצד המפסיד – הראשון בגמר מונדיאל הגברים מאז ג׳ף הרסט במדי אנגליה ב־1966."},"source":"https://www.fifa.com/en/tournaments/mens/worldcup","status":"active"},{"id":"vf16","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1500,"time":16,"q":{"en":"Which nation won UEFA Euro 1992?","he":"איזו נבחרת זכתה ביורו 1992?"},"answer":{"en":"Denmark","he":"דנמרק"},"distractors":[{"en":"Germany","he":"גרמניה"},{"en":"Netherlands","he":"הולנד"},{"en":"Sweden","he":"שוודיה"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Denmark only entered as a late replacement for the banned Yugoslavia, then beat world champions Germany 2-0 in the Gothenburg final.","he":"דנמרק הצטרפה לטורניר ברגע האחרון במקום יוגוסלביה המורחקת, ואז גברה על אלופת העולם גרמניה 0:2 בגמר בגטבורג."},"source":"https://www.uefa.com/uefaeuro/history/","status":"active"},{"id":"vf17","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1500,"time":16,"q":{"en":"Which nation won UEFA Euro 1996?","he":"איזו נבחרת זכתה ביורו 1996?"},"answer":{"en":"Germany","he":"גרמניה"},"distractors":[{"en":"Czech Republic","he":"צ׳כיה"},{"en":"England","he":"אנגליה"},{"en":"France","he":"צרפת"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Germany came from behind to beat the Czech Republic 2-1 at Wembley after a Patrik Berger penalty, and became the first team to win a major final with a golden goal.","he":"גרמניה חזרה מפיגור אחרי פנדל של פטריק ברגר וגברה על צ׳כיה 1:2 בוומבלי, והייתה לנבחרת הראשונה שזכתה בגמר של טורניר גדול בשער זהב."},"source":"https://www.uefa.com/uefaeuro/history/","status":"active"},{"id":"vf18","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1500,"time":16,"q":{"en":"Which nation won UEFA Euro 2000?","he":"איזו נבחרת זכתה ביורו 2000?"},"answer":{"en":"France","he":"צרפת"},"distractors":[{"en":"Italy","he":"איטליה"},{"en":"Netherlands","he":"הולנד"},{"en":"Portugal","he":"פורטוגל"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Sylvain Wiltord equalised in stoppage time in Rotterdam and David Trezeguet’s golden goal beat Italy 2-1, making France world and European champions at once.","he":"סילבן וילטור השווה בתוספת הזמן ברוטרדם, ושער הזהב של דויד טרזגה הכריע את איטליה 1:2 – וצרפת החזיקה בבת אחת בתואר העולמי והאירופי."},"source":"https://www.uefa.com/uefaeuro/history/","status":"active"},{"id":"vf19","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1460,"time":16,"q":{"en":"Which nation won UEFA Euro 2004?","he":"איזו נבחרת זכתה ביורו 2004?"},"answer":{"en":"Greece","he":"יוון"},"distractors":[{"en":"Portugal","he":"פורטוגל"},{"en":"Czech Republic","he":"צ׳כיה"},{"en":"Netherlands","he":"הולנד"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Otto Rehhagel’s Greece beat hosts Portugal twice, including the 1-0 final in Lisbon decided by Angelos Charisteas’ header.","he":"יוון של אוטו רהאגל גברה פעמיים על המארחת פורטוגל, כולל בגמר בליסבון שהוכרע 0:1 בנגיחה של אנגלוס חריסטאס."},"source":"https://www.uefa.com/uefaeuro/history/","status":"active"},{"id":"vf20","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1500,"time":16,"q":{"en":"Which nation won UEFA Euro 2008?","he":"איזו נבחרת זכתה ביורו 2008?"},"answer":{"en":"Spain","he":"ספרד"},"distractors":[{"en":"Germany","he":"גרמניה"},{"en":"Russia","he":"רוסיה"},{"en":"Turkey","he":"טורקיה"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Fernando Torres’ goal beat Germany 1-0 in Vienna, ending Spain’s 44-year wait for a major trophy since their Euro 1964 triumph.","he":"השער של פרננדו טורס הכריע את גרמניה 0:1 בווינה, וסיים המתנה של 44 שנה של ספרד לתואר גדול מאז זכייתה ביורו 1964."},"source":"https://www.uefa.com/uefaeuro/history/","status":"active"},{"id":"vf21","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1500,"time":16,"q":{"en":"Which nation won UEFA Euro 2012?","he":"איזו נבחרת זכתה ביורו 2012?"},"answer":{"en":"Spain","he":"ספרד"},"distractors":[{"en":"Italy","he":"איטליה"},{"en":"Germany","he":"גרמניה"},{"en":"Portugal","he":"פורטוגל"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Spain thrashed Italy 4-0 in Kyiv, the biggest winning margin in a Euro final, and became the first nation to retain the European title.","he":"ספרד ריסקה את איטליה 0:4 בקייב, הפער הגדול ביותר בגמר יורו, והפכה לנבחרת הראשונה שהגנה בהצלחה על התואר האירופי."},"source":"https://www.uefa.com/uefaeuro/history/","status":"active"},{"id":"vf22","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1460,"time":16,"q":{"en":"Which nation won UEFA Euro 2016?","he":"איזו נבחרת זכתה ביורו 2016?"},"answer":{"en":"Portugal","he":"פורטוגל"},"distractors":[{"en":"France","he":"צרפת"},{"en":"Wales","he":"ויילס"},{"en":"Germany","he":"גרמניה"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Portugal lost Cristiano Ronaldo to injury early in the final but beat hosts France 1-0 at the Stade de France through Éder’s extra-time strike.","he":"פורטוגל איבדה את כריסטיאנו רונאלדו לפציעה בשלב מוקדם של הגמר, אך גברה על המארחת צרפת 0:1 בסטאד דה פראנס בשער של אדר בהארכה."},"source":"https://www.uefa.com/uefaeuro/history/","status":"active"},{"id":"vf23","sport":"Football","type":"mc","entity":"national_team","difficulty":"MEDIUM","rating":1500,"time":16,"q":{"en":"Which nation won UEFA Euro 2020, played in 2021?","he":"איזו נבחרת זכתה ביורו 2020, שנערך ב־2021?"},"answer":{"en":"Italy","he":"איטליה"},"distractors":[{"en":"England","he":"אנגליה"},{"en":"Spain","he":"ספרד"},{"en":"Denmark","he":"דנמרק"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Italy drew 1-1 with England at Wembley and won the shoot-out 3-2, with Gianluigi Donnarumma named player of the tournament.","he":"איטליה סיימה 1:1 מול אנגליה בוומבלי וניצחה בפנדלים 2:3, וג׳אנלואיג׳י דונארומה נבחר לשחקן הטורניר."},"source":"https://www.uefa.com/uefaeuro/history/","status":"active"},{"id":"vf24","sport":"Football","type":"mc" ight sets in the final, completing his Career Grand Slam and equalling Pete Sampras's then-record of 14 major titles.","he":"פדרר ניצח בגמר את רובין סודרלינג בשלוש מערכות, השלים גראנד סלאם קריירה והשווה את השיא של פיט סמפראס דאז – 14 תארי גראנד סלאם."},"source":"https://en.wikipedia.org/wiki/List_of_French_Open_men%27s_singles_champions","status":"active","blocks":["vt24b"]},{"id":"vt9","sport":"Tennis","type":"mc","entity":"player","difficulty":"HARD","rating":1700,"time":18,"q":{"en":"Who won the men's singles title at Roland-Garros in 2015?","he":"מי זכה בתואר היחידים לגברים ברולאן גארוס 2015?"},"answer":{"en":"Stan Wawrinka","he":"סטן ואוורינקה"},"distractors":[{"en":"Novak Djokovic","he":"נובאק ג׳וקוביץ׳"},{"en":"Rafael Nadal","he":"רפאל נדאל"},{"en":"Andy Murray","he":"אנדי מארי"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Wawrinka beat world No. 1 Novak Djokovic in four sets in the final, denying the Serb the Career Grand Slam that year; Djokovic had knocked out Nadal in the quarterfinals.","he":"ואוורינקה ניצח בגמר את המדורג ראשון בעולם נובאק ג׳וקוביץ׳ בארבע מערכות ומנע ממנו להשלים גראנד סלאם קריירה באותה שנה; ג׳וקוביץ׳ הדיח את נדאל ברבע הגמר."},"source":"https://en.wikipedia.org/wiki/List_of_French_Open_men%27s_singles_champions","status":"active"},{"id":"vt10","sport":"Tennis","type":"mc","entity":"player","difficulty":"MEDIUM","rating":1540,"time":18,"q":{"en":"Who won the men's singles title at Roland-Garros in 2016?","he":"מי זכה בתואר היחידים לגברים ברולאן גארוס 2016?"},"answer":{"en":"Novak Djokovic","he":"נובאק ג׳וקוביץ׳"},"distractors":[{"en":"Andy Murray","he":"אנדי מארי"},{"en":"Stan Wawrinka","he":"סטן ואוורינקה"},{"en":"Rafael Nadal","he":"רפאל נדאל"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Djokovic beat Andy Murray in four sets to complete his Career Grand Slam and became the first man since Rod Laver in 1969 to hold all four major titles at once.","he":"ג׳וקוביץ׳ ניצח את אנדי מארי בארבע מערכות, השלים גראנד סלאם קריירה והיה לגב g/wiki/List_of_Australian_Open_men%27s_singles_champions","status":"active"},{"id":"vt20","sport":"Tennis","type":"mc","entity":"player","difficulty":"HARD","rating":1700,"time":18,"q":{"en":"Who won the men's singles title at the Australian Open in 2014?","he":"מי זכה בתואר היחידים לגברים באליפות אוסטרליה הפתוחה 2014?"},"answer":{"en":"Stan Wawrinka","he":"סטן ואוורינקה"},"distractors":[{"en":"Rafael Nadal","he":"רפאל נדאל"},{"en":"Novak Djokovic","he":"נובאק ג׳וקוביץ׳"},{"en":"Tomáš Berdych","he":"תומאש ברדיך"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Wawrinka knocked out defending champion Novak Djokovic in the quarterfinals and beat a back-injured Rafael Nadal in a four-set final for his first major.","he":"ואוורינקה הדיח ברבע הגמר את האלוף המכהן נובאק ג׳וקוביץ׳, ובגמר ניצח בארבע מערכות את רפאל נדאל שסבל מפציעה בגב – תואר הגראנד סלאם הראשון שלו."},"source":"https://en.wikipedia.org/wiki/List_of_Australian_Open_men%27s_singles_champions","status":"active"},{"id":"vt21","sport":"Tennis","type":"mc","entity":"player","difficulty":"MEDIUM","rating":1540,"time":18,"q":{"en":"Who won the men's singles title at the Australian Open in 2022?","he":"מי זכה בתואר היחידים לגברים באליפות אוסטרליה הפתוחה 2022?"},"answer":{"en":"Rafael Nadal","he":"רפאל נדאל"},"distractors":[{"en":"Daniil Medvedev","he":"דניל מדבדב"},{"en":"Novak Djokovic","he":"נובאק ג׳וקוביץ׳"},{"en":"Stefanos Tsitsipas","he":"סטפנוס ציציפס"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Nadal came back from two sets down to beat Daniil Medvedev in a final lasting more than five hours, winning a then-record 21st men's Grand Slam title.","he":"נדאל חזר מפיגור של שתי מערכות וניצח את דניל מדבדב בגמר שנמשך יותר מחמש שעות, וזכה בתואר הגראנד סלאם ה-21 שלו – שיא לגברים באותה עת."},"source":"https://en.wikipedia.org/wiki/List_of_Australian_Open_men%27s_singles_champions","status":"active"},{"id":"vt22","sport":"Tennis","type":"mc","entity":"player","difficulty":"MEDIUM","rating":1500,"time":18,"q":{"en" Söderling","he":"רובין סודרלינג"},"distractors":[{"en":"Juan Martín del Potro","he":"חואן מרטין דל פוטרו"},{"en":"Rafael Nadal","he":"רפאל נדאל"},{"en":"Fernando González","he":"פרננדו גונסאלס"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"The Swede had stunned four-time defending champion Rafael Nadal in the fourth round, Nadal's first ever defeat in Paris, before losing the final 6–1, 7–6, 6–4.","he":"השוודי הדהים בסיבוב הרביעי את האלוף ארבע פעמים ברציפות רפאל נדאל – ההפסד הראשון אי פעם של נדאל בפריז – לפני שהפסיד בגמר 6–1, 7–6, 6–4."},"source":"https://en.wikipedia.org/wiki/List_of_French_Open_men%27s_singles_champions","status":"active"},{"id":"vt25","sport":"Tennis","type":"mc","entity":"player","difficulty":"MEDIUM","rating":1560,"time":18,"q":{"en":"Which player completed a Career Grand Slam by winning the US Open in 2010?","he":"איזה שחקן השלים גראנד סלאם קריירה עם הזכייה באליפות ארה״ב הפתוחה 2010?"},"answer":{"en":"Rafael Nadal","he":"רפאל נדאל"},"distractors":[{"en":"Novak Djokovic","he":"נובאק ג׳וקוביץ׳"},{"en":"Roger Federer","he":"רוג׳ר פדרר"},{"en":"Andy Roddick","he":"אנדי רודיק"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Nadal beat Novak Djokovic in four sets in the New York final and, at 24, became the youngest man of the Open Era to complete the Career Grand Slam.","he":"נדאל ניצח את נובאק ג׳וקוביץ׳ בארבע מערכות בגמר בניו יורק, ובגיל 24 היה לגבר הצעיר ביותר בעידן הפתוח שהשלים גראנד סלאם קריירה."},"source":"https://www.usopen.org/en_US/visit/history/mschamps.html","status":"active"},{"id":"vt26b","sport":"Tennis","type":"mc","entity":"player","difficulty":"HARD","rating":1720,"time":18,"q":{"en":"Whom did Novak Djokovic beat in the 2016 Roland-Garros men's singles final?","he":"את מי ניצח נובאק ג׳וקוביץ׳ בגמר היחידים לגברים ברולאן גארוס 2016?"},"answer":{"en":"Andy Murray","he":"אנדי מארי"},"distractors":[{"en":"Stan Wawrinka","he":"סטן ואוורינקה"},{"en":"Rafael Nadal","he":"רפאל נדאל"},{"en":"Roger Federer","he":"רוג׳ר פדרר"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Djokovic recovered from losing the first set to win 3–6, 6–1, 6–2, 6–4; his opponent was the first British man to reach the Paris final since Bunny Austin in 1937.","he":"ג׳וקוביץ׳ התאושש מהפסד במערכה הראשונה וניצח 3–6, 6–1, 6–2, 6–4; יריבו היה הגבר הבריטי הראשון שהגיע לגמר בפריז מאז באני אוסטין ב-1937."},"source":"https://en.wikipedia.org/wiki/List_of_French_Open_men%27s_singles_champions","status":"active"},{"id":"vt27","sport":"Tennis","type":"mc","entity":"player","difficulty":"HARD","rating":1700,"time":18,"q":{"en":"Who won the men's singles title at Wimbledon in 1985?","he":"מי זכה בתואר היחידים לגברים בווימבלדון 1985?"},"answer":{"en":"Boris Becker","he":"בוריס בקר"},"distractors":[{"en":"Kevin Curren","he":"קווין קארן"},{"en":"John McEnroe","he":"ג׳ון מקנרו"},{"en":"Ivan Lendl","he":"איוון לנדל"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"At 17 and unseeded, Becker beat Kevin Curren in four sets in the final, becoming Wimbledon's youngest men's singles champion and its first German winner.","he":"בגיל 17 וללא דירוג מוקדם, ניצח בקר את קווין קארן בארבע מערכות בגמר, והיה לאלוף היחידים הצעיר ביותר בתולדות ווימבלדון ולזוכה הגרמני הראשון בטורניר."},"source":"https://en.wikipedia.org/wiki/List_of_Wimbledon_gentlemen%27s_singles_champions","status":"active"},{"id":"vt28","sport":"Tennis","type":"mc","entity":"player","difficulty":"EXPERT","rating":1880,"time":18,"q":{"en":"Who won the men's singles title at Wimbledon in 1992?","he":"מי זכה בתואר היחידים לגברים בווימבלדון 1992?"},"answer":{"en":"Andre Agassi","he":"אנדרה אגאסי"},"distractors":[{"en":"Goran Ivanišević","he":"גוראן איבנישביץ׳"},{"en":"Stefan Edberg","he":"סטפן אדברג"},{"en":"Boris Becker","he":"בוריס בקר"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Agassi beat big-serving Goran Ivanišević in a five-set final for his first Grand Slam title, having skipped Wimbledon from 1988 to 1990.","he":"אגאסי ניצח בגמר בן חמש מערכות את בעל ההגשה האדירה גוראן איבנישביץ׳ וזכה בתואר הגראנד סלאם הראשון שלו, אחרי שוויתר על ווימבלדון בשנים 1988–1990."},"source":"https://en.wikipedia.org/wiki/List_of_Wimbledon_gentlemen%27s_singles_champions","status":"active"},{"id":"vt29","sport":"Tennis","type":"mc","entity":"player","difficulty":"EXPERT","rating":1900,"time":18,"q":{"en":"Who won the men's singles title at Wimbledon in 1996?","he":"מי זכה בתואר היחידים לגברים בווימבלדון 1996?"},"answer":{"en":"Richard Krajicek","he":"ריכרד קראייצ׳ק"},"distractors":[{"en":"MaliVai Washington","he":"מליוואי וושינגטון"},{"en":"Pete Sampras","he":"פיט סמפראס"},{"en":"Goran Ivanišević","he":"גוראן איבנישביץ׳"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Krajicek beat three-time defending champion Pete Sampras in the quarterfinals and MaliVai Washington in a straight-sets final, becoming the first Dutch man to win Wimbledon singles.","he":"קראייצ׳ק ניצח ברבע הגמר את האלוף המכהן שלוש פעמים ברציפות פיט סמפראס, ובגמר גבר על מליוואי וושינגטון בשלוש מערכות – הגבר ההולנדי הראשון שזכה ביחידים בווימבלדון."},"source":"https://en.wikipedia.org/wiki/List_of_Wimbledon_gentlemen%27s_singles_champions","status":"active"},{"id":"vt30","sport":"Tennis","type":"mc","entity":"player","difficulty":"HARD","rating":1720,"time":18,"q":{"en":"Who won the men's singles title at the US Open in 2000?","he":"מי זכה בתואר היחידים לגברים באליפות ארה״ב הפתוחה 2000?"},"answer":{"en":"Marat Safin","he":"מראט סאפין"},"distractors":[{"en":"Pete Sampras","he":"פיט סמפראס"},{"en":"Andre Agassi","he":"אנדרה אגאסי"},{"en":"Lleyton Hewitt","he":"לייטון יואיט"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"The 20-year-old Russian overpowered Pete Sampras 6–4, 6–3, 6–3 in the final for the first of his two Grand Slam titles.","he":"הרוסי בן ה-20 גבר על פיט סמפראס 6–4, 6–3, 6–3 בגמר וזכה בראשון משני תארי הגראנד סלאם שלו."},"source":"https://www.usopen.org/en_US/visit/history/mschamps.html","status":"active"},{"id":"vt31","sport":"Tennis","type":"mc","entity":"player","difficulty":"HARD","rating":1700,"time":18,"q":{"en":"Who won the men's singles title at the US Open in 2002?","he":"מי זכה בתואר היחידים לגברים באליפות ארה״ב הפתוחה 2002?"},"answer":{"en":"Pete Sampras","he":"פיט סמפראס"},"distractors":[{"en":"Andre Agassi","he":"אנדרה אגאסי"},{"en":"Lleyton Hewitt","he":"לייטון יואיט"},{"en":"Andy Roddick","he":"אנדי רודיק"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"Sampras beat his great rival Andre Agassi in four sets for a then-record 14th major title, and it proved to be the last match of his professional career.","he":"סמפראס ניצח את יריבו הגדול אנדרה אגאסי בארבע מערכות וזכה בתואר הגראנד סלאם ה-14 שלו – שיא באותה עת – וזה התברר כמשחק האחרון בקריירה המקצוענית שלו."},"source":"https://www.usopen.org/en_US/visit/history/mschamps.html","status":"active"},{"id":"vt32","sport":"Tennis","type":"mc","entity":"player","difficulty":"EXPERT","rating":1900,"time":18,"q":{"en":"Who won the men's singles title at Roland-Garros in 2004?","he":"מי זכה בתואר היחידים לגברים ברולאן גארוס 2004?"},"answer":{"en":"Gastón Gaudio","he":"גסטון גאודיו"},"distractors":[{"en":"Guillermo Coria","he":"גיירמו קוריה"},{"en":"David Nalbandian","he":"דוד נלבנדיאן"},{"en":"Juan Carlos Ferrero","he":"חואן קרלוס פררו"}],"aliases":{"en":[],"he":[]},"explanation":{"en":"In an all-Argentine final, Gaudio lost the first two sets to Guillermo Coria and saved two match points before winning the fifth set 8–6.","he":"בגמר ארגנטינאי טהור, גאודיו הפסיד בשתי המערכות הראשונות לגיירמו קוריה והציל שתי נקודות משחק לפני שניצח במערכה החמישית 8–6."},"source":"https://en.wikipedia.org/wiki/List_of_French_Open_men%27s_singles_champions","status":"active"},{"id":"vt33","sport":"Tennis","type":"mc","entity":"player","difficulty":"HARD","rating":1680,"time":18,"q":{"en":"Who won the men's singles title at the Australian Open in 2010?","he":"מי זכה בתואר היחידים לגברים באליפות אוסטרליה הפתוחה 2010?"},"answer":{"en":"Roger Federer","he":"רוג׳ר פדרר"},"distractors":[{"en":"Andy Murray","h יגור של שתי מערכות מול אלכסנדר זברב וניצח בגמר בשובר שוויון במערכה החמישית, אחרי שג׳וקוביץ׳ נפסל בסיבוב הרביעי."},"source":"https://www.usopen.org/en_US/visit/history/mschamps.html","status":"active"},{"id":"ht1","sport":"Tennis","type":"exact","entity":"number","difficulty":"EXPERT","rating":1900,"time":20,"q":{"en":"John Isner won the fifth set of his 2010 Wimbledon first-round match against Nicolas Mahut 70 games to how many?","he":"ג׳ון איסנר ניצח במערכה החמישית של משחק הסיבוב הראשון שלו מול ניקולא מאהו בווימבלדון 2010 בתוצאה 70 משחקונים לכמה?"},"answer":{"en":"68","he":"68"},"distractors":[],"aliases":{"en":[],"he":[]},"explanation":{"en":"The match on Court 18 was played over three days (22–24 June 2010) and lasted 11 hours 5 minutes; Isner served 113 aces and Mahut 103.","he":"המשחק במגרש 18 נמשך שלושה ימים (22–24 ביוני 2010) ו-11 שעות ו-5 דקות; איסנר הגיש 113 אייסים ומאהו 103."},"source":"https://en.wikipedia.org/wiki/Isner%E2%80%93Mahut_match_at_the_2010_Wimbledon_Championships","status":"active"},{"id":"ht2","sport":"Tennis","type":"open","entity":"player","difficulty":"SICKO","rating":2080,"time":25,"q":{"en":"Who became the first woman to win all four major singles titles in the same calendar year, doing so in 1953?","he":"מי הייתה האישה הראשונה שזכתה בכל ארבעת תארי היחידים הגדולים באותה שנה קלנדרית, ב-1953?"},"answer":{"en":"Maureen Connolly","he":"מורין קונולי"},"distractors":[],"aliases":{"en":["Connolly","Maureen Connolly Brinker","Little Mo"],"he":["קונולי","מורין קונלי","מורין קונולי ברינקר"]},"explanation":{"en":"Nicknamed \"Little Mo\", the American won nine major singles titles before a July 1954 horse-riding accident in San Diego ended her career at just 19.","he":"האמריקאית, שכונתה \"ליטל מו\", זכתה בתשעה תארי יחידים גדולים לפני שתאונת רכיבה על סוס ביולי 1954 בסן דייגו סיימה את הקריירה שלה בגיל 19 בלבד."},"source":"https://en.wikipedia.org/wiki/Maureen_Connolly","status":"active"},{"id":"ht3","sport":"Tennis","type":"open","entity":"player","d // Conservative fuzzy matching: tolerates typos, transpositions, diacritics/niqqud, word order and Hebrew

function norm(s) {

    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')          // Latin diacritics (é, ć, ö, ă ...)
    .replace(/[֑-ׇ]/g, '')          // Hebrew niqqud and cantillation

    .replace(/ß/g, 'ss').replace(/ø/g, 'o').replace(/đ/g, 'd').replace(/ł/g, 'l')

    .replace(/[ךםןףץ]/g, c => ({ 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' })[c])  // final letters
    .replace(/[^a-z0-9א-ת]+/g, ' ')
    .replace(/\s+/g, ' ')

// Hebrew transliteration variants: drop matres lectionis (ו/י) and double letters for a looser comparison key.
function heSkeleton(s) {

// Optimal string alignment distance (Levenshtein + adjacent transposition).
function osa(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const d = [];
  for (let i = 0; i <= m; i++) { d[i] = [i]; }
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
  }
  return d[m][n];
}

// Allowed edits for a target of a given length.
function tolerance(len) {

  if (len <= 7) return 1;
  if (len <= 12) return 2;
  return 3;
}

function distance(input, cand) {

  return Number(s);

// ---------- Sound (synthesised with WebAudio: no files, works offline; off by default, toggle on Home) ----------
const SFX = (() => {
  let ctx = null;
  const NOTES = {
    correct: [[660, 0, 0.09], [990, 0.08, 0.16]],
    wrong: [[196, 0, 0.28, 'sawtooth', 0.07]],
    timeout: [[247, 0, 0.18, 'triangle'], [185, 0.16, 0.3, 'triangle']],
    tick: [[1250, 0, 0.035, 'square', 0.03]],
    streak: [[523, 0, 0.1], [659, 0.08, 0.1], [784, 0.16, 0.1], [1047, 0.24, 0.22]],
    finish: [[392, 0, 0.14], [523, 0.13, 0.14], [659, 0.26, 0.14], [784, 0.39, 0.34]]
  };
  return {
    play(name) {
      if (!P.sound || !NOTES[name]) return;
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        for (const [f, at, dur, type = 'sine', vol = 0.12] of NOTES[name]) {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = type; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, now + at);
          g.gain.exponentialRampToValueAtTime(vol, now + at + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, now + at + dur);
          o.connect(g).connect(ctx.destination);
          o.start(now + at); o.stop(now + at + dur + 0.02);
        }
      } catch (e) { /* audio is optional */ }
    }
  };
})();

function countUp(el, from, to, ms = 650) {
  if (!el) return;
  if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = to; return; }
  const t0 = performance.now();
  const step = now => { const p = Math.min(1, (now - t0) / ms); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function burst() {
  const box = document.createElement('div');
  box.className = 'burst';
  const colors = ['#23d18b', '#ffd166', '#ff8a3d', '#8dc8ff', '#ff5364', '#c792ea'];
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, r = 90 + Math.random() * 170;
    const sp = document.createElement('i');
    sp.style.cssText = `--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r - 60}px;--rot:${Math.random() * 540}deg;background:${colors[i % colors.length]}`;
    box.appendChild(sp);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 1100);
}

// ---------- Sharing (WhatsApp link + copy; no server) ----------
function shareText(kind, d) {
  const lines = [t('appTitle') + ' – ' + (kind === 'daily' ? `${t('mode_daily')} #${d.day}` : modeName(d.mode) + (d.sport && d.sport !== 'Mixed' ? ' • ' + t('sport_' + d.sport) : ''))];
  lines.push(d.marks);
  lines.push(t('shareScore', { score: d.score, c: d.correct, n: d.n }));
  if (kind !== 'daily') lines.push(`${t('sportsIq')} ${d.iq} • ${t('rank_' + d.rank)}`);
  lines.push(t('shareCta'));
  return lines.join('\n');
}
function shareButtons(text) {
  return `<a class="btn share" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener noreferrer">${esc(t('shareWa'))}</a><button class="btn" type="button" data-copy="${esc(text)}">${esc(t('copy'))}</button>`;
}
async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
  }
  if (ok && btn) { btn.textContent = t('copied'); setTimeout(() => { if (btn.isConnected) btn.textContent = t('copy'); }, 1600); }
}
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-copy]'); if (b) copyText(b.dataset.copy, b); });

// ---------- Modal (replaces native confirm so text and buttons are translated) ----------
function openModal({ title, body, yes, no, danger, onYes, onNo }) {
  closeModal();
  const m = document.createElement('div');
  m.className = 'modal-backdrop';
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">${esc(title)}</h2><p>${esc(body)}</p>
    <div class="modal-actions"><button class="btn ${danger ? 'danger' : 'primary'}" id="mYes">${esc(yes)}</button>${no ? `<button class="btn" id="mNo">${esc(no)}</button>` : ''}</div></div>`;
  document.body.appendChild(m);
  const done = fn => () => { closeModal(); fn && fn(); };
  m.querySelector('#mYes').onclick = done(onYes);
  if (no) m.querySelector('#mNo').onclick = done(onNo);
  m.onkeydown = e => { if (e.key === 'Escape') { e.stopPropagation(); done(onNo)(); } };
  m.querySelector(no ? '#mNo' : '#mYes').focus();
}
function closeModal() { document.querySelectorAll('.modal-backdrop').forEach(x => x.remove()); }
const modalOpen = () => !!document.querySelector('.modal-backdrop');

// Backup file download / restore (the only way to move stats between browsers or devices).
function exportData() {
  const blob = new Blob([JSON.stringify(makeBackup(STORE), null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sports-trivia-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    const store = parseBackup(String(r.result));
    if (!store) return openModal({ title: t('importBadTitle'), body: t('importBadBody'), yes: t('ok') });
    openModal({
      title: t('importTitle'), body: t('importBody', { n: Object.keys(store.profiles).length }), yes: t('importYes'), no: t('cancel'), danger: true,
      onYes: () => { STORE = store; P = STORE.profiles[STORE.activeId]; save(); render(); }
    });
  };
  r.readAsText(file);
}

// ---------- Game flow ----------
function startDaily() {
  const key = dayKey();
  if (P.daily[key]) return render();
  S.mode = 'daily'; S.sport = 'Mixed'; S.dailyKey = key;
  // Recorded at the start so leaving early still uses up today's try.
  P.daily[key] = { score: 0, correct: 0, n: 0, marks: '' };
  const keys = Object.keys(P.daily).sort();
  keys.slice(0, Math.max(0, keys.length - 60)).forEach(k => delete P.daily[k]);
  save();
  startGame(dailyQuestions(BANK, key));
}

function startGame(fixedPool) {
  const m = MODES[S.mode];
  Object.assign(S, {
    pool: Array.isArray(fixedPool) ? fixedPool.slice() : buildPool(BANK, S.sport), seen: new Set(P.seen), q: null, index: 0, answered: 0, score: 0, streak: 0, maxStreak: 0,
    lives: m.lives || 0, misses: 0, session: [], used: { fifty: false, hint: false, plus: false, swap: false },
    startRating: P.rating, blocked: new Set(), endReason: null, newBest: false, lastSport: null, status: 'COUNTDOWN', screen: 'count'
  });
  render();
}

function renderCount() {
  let n = 3;
  app.innerHTML = `<main class="shell count"><button class="btn exitbtn corner" id="arenaHome">${esc(t('homeExit'))}</button><div id="c" aria-live="polite">${n}</div></main>`;
  $('#arenaHome').onclick = () => { clearAllTimers(); S.status = 'IDLE'; S.screen = 'home'; render(); };
  clearInterval(S.countTimer);
  S.countTimer = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(S.countTimer); S.countTimer = null; S.screen = 'game'; loadQuestion(); }
    else { const c = document.getElementById('c'); if (c) c.textContent = n; }
  }, 450);
}

function loadQuestion(replaceCurrent) {
  clearAllTimers();
  const state = { misses: S.misses, lives: S.lives, answered: S.answered };
  if (!replaceCurrent && isGameOver(S.mode, state)) return finish();
  const m = MODES[S.mode];
  const q = m.daily ? S.pool.shift() || null
    : pickNext(S.pool, { rating: P.rating, streak: S.streak, index: S.index, rising: m.rising, rotate: m.rotate, lastSport: S.lastSport, blocked: S.blocked, seen: S.seen });
  if (!q) { S.endReason = 'pool'; return finish(); }
  S.q = q;
  S.lastSport = q.sport;
  (q.blocks || []).forEach(id => S.blocked.add(id));
  S.opts = q.type === 'mc' ? shuffle([{ ...q.answer, correct: true }, ...q.distractors.map(d => ({ ...d, correct: false }))]) : [];
  S.qTime = questionTime(q, S.mode);
  S.remaining = S.qTime;
  S.deadline = performance.now() + S.qTime * 1000;
  S.pausedRemaining = null;
  S.lastTick = null;
  S.status = 'ACTIVE';
  S.screen = 'game';
  renderGame();
  startTimer();
}

function startTimer() {
  clearInterval(S.timer);
  if (!P.timer) return;
  const tick = () => {
    if (S.status !== 'ACTIVE') return;
    S.remaining = Math.max(0, (S.deadline - performance.now()) / 1000);
    updateTimer();
    if (S.remaining <= 0) submit(null, true);
  };
  S.timer = setInterval(tick, 100);
  tick();
}

function pauseTimer() {
  if (S.status !== 'ACTIVE') return false;
  S.pausedRemaining = Math.max(0, (S.deadline - performance.now()) / 1000);
  S.status = 'PAUSED';
  clearInterval(S.timer); S.timer = null;
  return true;
}
function resumeTimer() {
  if (S.status !== 'PAUSED') return;
  S.deadline = performance.now() + S.pausedRemaining * 1000;
  S.pausedRemaining = null;
  S.status = 'ACTIVE';
  startTimer();
}

function updateTimer() {
  const el = $('.timer');
  if (!el || !S.q || !P.timer) return;
  const p = Math.max(0, S.remaining / S.qTime * 100);
  el.style.setProperty('--p', p + '%');
  el.classList.toggle('warn', S.remaining <= 5 && S.remaining > 2);
  el.classList.toggle('crit', S.remaining <= 2);
  const sec = Math.ceil(S.remaining);
  el.querySelector('b').textContent = sec;
  if (sec <= 5 && sec > 0 && S.lastTick !== sec && S.status === 'ACTIVE') { S.lastTick = sec; SFX.play('tick'); }
}

function progressTotal() { const c = MODES[S.mode].count; return Number.isFinite(c) ? c : null; }

function renderGame() {
  const q = S.q;
  const total = progressTotal();
  const m = MODES[S.mode];
  const seg = x => (x.correct ? 'ok' : 'no');
  const track = (total ? Array.from({ length: total }, (_, i) => (S.session[i] ? seg(S.session[i]) : i === S.index ? 'now' : ''))
    : [...S.session.map(seg), 'now']).map(c => `<i class="${c}"></i>`).join('');
  const answerUI = q.type === 'mc'
    ? `<div class="grid" role="group">${S.opts.map((o, i) => `<button class="choice" data-i="${i}"><span class="key">${i + 1}</span><span class="txt">${esc(o[LANG])}</span></button>`).join('')}</div>`
    : `<form class="openrow" id="ansForm"><input id="ans" ${q.type === 'exact' ? 'inputmode="numeric" dir="ltr"' : ''} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t(q.type === 'exact' ? 'number' : 'typeAnswer'))}" aria-label="${esc(t(q.type === 'exact' ? 'number' : 'typeAnswer'))}"><button class="btn primary" type="submit" id="submit">${esc(t('lockIn'))}</button></form>`;
  app.innerHTML = `<main class="shell screen game" style="--sp:var(--sp-${q.sport})"><div class="wrap">
    <div class="topbar">
      <div class="top-actions"><button class="btn exitbtn" id="arenaHome">${esc(t('homeExit'))}</button><span class="live">● ${esc(t('live'))}</span></div>
      <div class="scoreline"><span class="scorebox">${esc(t('score'))} <b id="score">${S.score}</b></span><span>${esc(t('streak'))} <b id="streakN">${S.streak}${S.streak >= 3 ? ' 🔥' : ''}</b></span>${MODES[S.mode].lives ? `<span>${esc(t('lives'))} <b id="lives">${'♥'.repeat(Math.max(0, S.lives))}</b></span>` : ''}</div>
    </div>
    <div class="qhead"><div class="qmain">
      <div class="qmeta"><span class="pill sp">${QSPORT_ICON[q.sport]} ${esc(qsport(q.sport))}</span><span class="pill diff-${q.difficulty}">${esc(t('diff_' + q.difficulty))}</span><span class="pill">${esc(total ? t('qNumOf', { n: S.index + 1, total }) : t('qNum', { n: S.index + 1 }))}</span></div>
      <h1 class="question" id="qtext">${esc(L(q.q))}</h1>
    </div>
    <div class="timer ${P.timer ? '' : 'off'}" style="--p:100%" role="timer" aria-live="off"><b>${P.timer ? S.qTime : esc(t('timerOff'))}</b></div></div>
    ${answerUI}
    <div id="fb" aria-live="polite"></div>
    <div class="track${total ? '' : ' open'}" aria-hidden="true">${track}</div>
    ${m.noLifelines ? `<p class="subtle small">${esc(t('dailyNoLifelines'))}</p>` : ''}
    <div class="lifelines"${m.noLifelines ? ' hidden' : ''}>
      <button class="btn life" id="fifty" ${q.type !== 'mc' || S.used.fifty ? 'disabled' : ''}>${esc(t('fifty'))}</button>
      <button class="btn life" id="hint" ${S.used.hint ? 'disabled' : ''}>${esc(t('hint'))}</button>
      <button class="btn life" id="plus" ${S.used.plus || !P.timer ? 'disabled' : ''}>${esc(t('plus10'))}</button>
      <button class="btn life" id="swap" ${S.used.swap ? 'disabled' : ''}>${esc(t('switchQ'))}</button>
    </div>
  </div></main>`;
  $('#arenaHome').onclick = confirmExit;
  app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => submit(+b.dataset.i));
  const form = $('#ansForm');
  if (form) {
    form.onsubmit = e => { e.preventDefault(); submit($('#ans').value); };
    const inp = $('#ans');
    // Avoid popping the keyboard over the question on small touch screens.
    if (!matchMedia('(pointer:coarse)').matches) inp.focus();
  }
  $('#fifty').onclick = useFifty;
  $('#hint').onclick = useHint;
  $('#plus').onclick = () => { if (S.status !== 'ACTIVE') return; S.used.plus = true; S.deadline += 10000; $('#plus').disabled = true; };
  $('#swap').onclick = () => { if (S.status !== 'ACTIVE') return; S.used.swap = true; loadQuestion(true); };
  updateTimer();
}

function useFifty() {
  if (S.status !== 'ACTIVE' || S.q.type !== 'mc') return;
  S.used.fifty = true;
  const wrong = S.opts.map((o, i) => i).filter(i => !S.opts[i].correct);
  shuffle(wrong).slice(0, 2).forEach(i => { const b = app.querySelector(`[data-i="${i}"]`); if (b) { b.disabled = true; b.classList.add('gone'); } });
  $('#fifty').disabled = true;
}

function useHint() {
  if (S.status !== 'ACTIVE') return;
  S.used.hint = true;
  const a = String(S.q.answer[LANG]);
  let text;
  if (S.q.type === 'exact') text = t('hintDigits', { n: a.length, c: a[0] });
  else {
    const wordsN = a.trim().split(/\s+/).length;
    text = t('hintStarts', { c: a[0] }) + (S.q.type === 'open' && wordsN > 1 ? ' • ' + t('hintWords', { n: wordsN }) : '');
  }
  const h = $('#hint'); h.disabled = true; h.textContent = text; h.classList.add('used');
}

function confirmExit() {
  const wasActive = pauseTimer();
  const inFeedback = S.status === 'ANSWERED' || S.status === 'TIMEOUT';
  if (inFeedback) { clearTimeout(S.advanceTimer); S.advanceTimer = null; }
  openModal({
    title: t('exitTitle'), body: t('exitBody'), yes: t('exitYes'), no: t('exitNo'), danger: true,
    onYes: () => { clearAllTimers(); S.status = 'IDLE'; S.q = null; S.screen = 'home'; render(); },
    onNo: () => {
      if (wasActive) resumeTimer();
      else if (inFeedback) S.advanceTimer = setTimeout(advanceQuestion, 1500);
    }
  });
}

function isCorrect(v, q) {
  if (v === null || v === undefined) return { ok: false };
  if (q.type === 'mc') return { ok: !!(S.opts[v] && S.opts[v].correct) };
  if (q.type === 'exact') { const n = parseNumber(v); return { ok: n !== null && n === Number(q.answer.en) }; }
  const cands = [q.answer.en, q.answer.he, ...(q.aliases ? [...q.aliases.en, ...q.aliases.he] : [])];
  return matchAnswer(v, cands, ALL_NAMES);
}

function submit(v, timeout = false) {
  if (S.status !== 'ACTIVE') return;
  const q = S.q;
  if (!timeout && q.type !== 'mc' && !String(v || '').trim()) return;  // ignore empty submissions
  S.status = timeout ? 'TIMEOUT' : 'ANSWERED';
  clearInterval(S.timer); S.timer = null;
  const rem = P.timer ? Math.max(0, (S.deadline - performance.now()) / 1000) : S.qTime;
  const frac = Math.min(1, rem / S.qTime);
  const ok = !timeout && isCorrect(v, q).ok;
  const pts = questionPoints(q.difficulty, ok, frac, S.streak, P.timer);
  const scoreBefore = S.score;
  if (ok) { S.streak++; S.maxStreak = Math.max(S.maxStreak, S.streak); S.score += pts; }
  else { S.streak = 0; S.misses++; if (MODES[S.mode].lives) S.lives--; }
  const delta = ratingDelta(P.rating, q.rating, ok, frac, P.total);
  P.rating = Math.max(800, P.rating + delta);
  P.seen = [...new Set([...P.seen, q.id])].slice(-400);
  P.correct += ok ? 1 : 0;
  P.total++;
  P.longest = Math.max(P.longest || 0, S.maxStreak);
  const given = q.type === 'mc' ? (v === null ? '' : S.opts[v][LANG]) : (v || '');
  S.session.push({ id: q.id, given, givenIdx: q.type === 'mc' ? v : null, correct: ok, timeout, points: pts, response: +(S.qTime - rem).toFixed(1), delta, lang: LANG });
  S.answered++;
  if (MODES[S.mode].daily && S.dailyKey) {
    const c = S.session.filter(x => x.correct).length;
    P.daily[S.dailyKey] = { score: S.score, correct: c, n: S.session.length, marks: resultMarks(S.session) };
  }
  save();
  showFeedback(ok, timeout, pts, v, scoreBefore);
  const milestone = ok && [3, 5, 8, 10, 15, 20].includes(S.streak);
  SFX.play(milestone ? 'streak' : ok ? 'correct' : timeout ? 'timeout' : 'wrong');
  if (milestone) { streakPop(t('streak' + S.streak)); burst(); }
  S.advanceTimer = setTimeout(advanceQuestion, ok ? FEEDBACK_MS.correct : timeout ? FEEDBACK_MS.timeout : FEEDBACK_MS.wrong);
}

function showFeedback(ok, timeout, pts, v, scoreBefore) {
  app.querySelectorAll('.choice, #ans, #submit, .life').forEach(x => x.disabled = true);
  if (S.q.type === 'mc') app.querySelectorAll('[data-i]').forEach(b => {
    const i = +b.dataset.i;
    if (S.opts[i].correct) b.classList.add('correct');
    else if (i === v) b.classList.add('wrong');
  });
  const sc = $('#score');
  countUp(sc, scoreBefore, S.score);
  if (ok && sc) { const g = document.createElement('span'); g.className = 'gain'; g.dir = 'ltr'; g.textContent = '+' + pts; sc.parentElement.appendChild(g); setTimeout(() => g.remove(), 1200); }
  const sn = $('#streakN'); if (sn) sn.textContent = S.streak + (S.streak >= 3 ? ' 🔥' : '');
  const cur = app.querySelector('.track i.now'); if (cur) cur.className = ok ? 'ok' : 'no';
  const lv = $('#lives'); if (lv) lv.textContent = '♥'.repeat(Math.max(0, S.lives));
  const head = timeout ? t('timeUp') : ok ? t('correctPts', { pts }) : t('incorrect');
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}" role="button" tabindex="0">
    <strong>${esc(head)}</strong>
    ${!ok ? `<p class="ans">${esc(t('correctAnswer'))} <b>${esc(L(S.q.answer))}</b></p>` : ''}
    <p class="expl">${esc(L(S.q.explanation))}</p>
    <div class="advance">${esc(t('advance'))}</div>
    <a class="report" id="report" href="${esc(reportLink(S.q, LANG, t))}" target="_blank" rel="noopener noreferrer">⚑ ${esc(t('report'))}</a></div>`;
  const f = $('.feedback');
  f.onclick = advanceQuestion;
  // Reporting opens WhatsApp; hold the game on this feedback so the player comes back to the same question.
  $('#report').onclick = e => { e.stopPropagation(); clearTimeout(S.advanceTimer); S.advanceTimer = null; $('.feedback .advance').textContent = t('reportPaused'); };
  f.focus({ preventScroll: true });
  if (window.innerWidth < 760) f.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function advanceQuestion() {
  if (S.status !== 'ANSWERED' && S.status !== 'TIMEOUT') return;
  if (modalOpen()) return;
  S.status = 'TRANSITIONING';
  clearTimeout(S.advanceTimer); S.advanceTimer = null;
  S.index++;
  loadQuestion();
}

document.addEventListener('keydown', e => {
  if (modalOpen()) return;
  if ((e.key === 'Enter' || e.key === ' ') && (S.status === 'ANSWERED' || S.status === 'TIMEOUT')) { e.preventDefault(); advanceQuestion(); return; }
  if (S.screen === 'game' && S.status === 'ACTIVE' && S.q && S.q.type === 'mc' && /^[1-4]$/.test(e.key)) {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const b = app.querySelector(`[data-i="${+e.key - 1}"]`);
    if (b && !b.disabled) b.click();
  }
});

function streakPop(text) {
  const d = document.createElement('div');
  d.className = 'streakpop'; d.textContent = text;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 900);
}

function finish() {
  clearAllTimers();
  if (!S.endReason) S.endReason = MODES[S.mode].oneMiss && S.misses ? 'sudden' : MODES[S.mode].lives && S.lives <= 0 ? 'endurance' : null;
  S.status = 'IDLE';
  S.screen = 'results';
  const n = S.session.length, c = S.session.filter(x => x.correct).length;
  const accuracy = n ? Math.round(c / n * 100) : 0;
  P.games++;
  P.lastScore = S.score;
  P.lastAccuracy = accuracy;
  S.newBest = S.score > (P.bestScore || 0);
  P.bestScore = Math.max(P.bestScore || 0, S.score);
  SFX.play('finish');
  P.history = [{ date: new Date().toISOString(), score: S.score, accuracy, mode: S.mode, sport: S.sport, correct: c, total: n,
    ratingChange: Math.round(P.rating - S.startRating), iqChange: iqDisplay(P.rating) - iqDisplay(S.startRating), streak: S.maxStreak }, ...P.history].slice(0, 30);
  save();
  render();
}

function renderResults() {
  const n = S.session.length, c = S.session.filter(x => x.correct).length;
  const avg = n ? (S.session.reduce((a, x) => a + x.response, 0) / n).toFixed(1) : '0';
  const d = iqDisplay(P.rating) - iqDisplay(S.startRating);
  const rk = rankKey(P.rating, P.total, P.correct);
  const isDaily = S.mode === 'daily';
  const marks = resultMarks(S.session);
  const dnum = isDaily && S.dailyKey ? dayNumber(S.dailyKey) : null;
  const share = shareText(isDaily ? 'daily' : 'game', { day: dnum, mode: S.mode, sport: S.sport, marks, score: S.score, correct: c, n, iq: iqDisplay(P.rating), rank: rk });
  app.innerHTML = `<main class="shell screen"><div class="wrap">
    <div class="results-hero"><div class="eyebrow">${isDaily ? `📅 ${esc(t('mode_daily'))} #${dnum} • ` : ''}${esc(t('finalScore'))}</div><div class="big pop-in" id="finalScore">${S.score}</div>
      ${S.newBest && S.score > 0 ? `<div class="newbest">${esc(t('newBest'))}</div>` : ''}
      <div class="rank">${esc(t('sportsIq'))} ${iqDisplay(P.rating)} • ${esc(t('rank_' + rk))} <span class="delta ${d >= 0 ? 'up' : 'down'}" dir="ltr">${d >= 0 ? '+' : ''}${d}</span></div>
      ${S.endReason ? `<p class="subtle">${esc(t('ended_' + S.endReason))}</p>` : ''}
    </div>
    <div class="cards">
      <div class="mini"><span>${esc(t('accuracy'))}</span><b>${n ? Math.round(c / n * 100) : 0}%</b></div>
      <div class="mini"><span>${esc(t('correctCount'))}</span><b dir="ltr">${c}/${n}</b></div>
      <div class="mini"><span>${esc(t('bestStreak'))}</span><b>${S.maxStreak}</b></div>
      <div class="mini"><span>${esc(t('avgResponse'))}</span><b>${esc(t('seconds', { n: avg }))}</b></div>
    </div>
    ${n ? `<section class="share-card"><h2>${esc(t('resultsShare'))}</h2><div class="marks" dir="ltr">${esc(marks)}</div><div class="share-row">${shareButtons(share)}</div></section>` : ''}
    ${n ? `<p class="subtle">${esc(t('reviewHint'))}</p>` : ''}
    <div class="timeline">${S.session.map((x, i) => `<button class="dot ${x.correct ? 'ok' : 'no'}" data-r="${i}" aria-label="${esc(t('qNum', { n: i + 1 }))}">${x.correct ? '✓' : x.timeout ? '⏱' : '✕'}</button>`).join('')}</div>
    <div id="review"></div>
    <div class="cta"><button class="btn primary big" id="again">${esc(t('playAgain'))}</button><button class="btn" id="home">${esc(t('home'))}</button></div>
  </div></main>`;
  app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => showReview(+b.dataset.r));
  $('#again').onclick = () => { S.screen = 'select'; render(); };
  $('#home').onclick = () => { S.screen = 'home'; render(); };
}

function showReview(i) {
  const x = S.session[i];
  const q = BANK.find(b => b.id === x.id);
  if (!q) return;
  let given = x.given;
  if (q.type === 'mc' && x.givenIdx !== null && x.lang !== LANG) {
    const o = [q.answer, ...q.distractors].find(o => o[x.lang] === x.given);
    if (o) given = o[LANG];
  }
  app.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('cur', j === i));
  $('#review').innerHTML = `<div class="review">
    <div class="qmeta"><span class="pill">${esc(qsport(q.sport))}</span><span class="pill">${esc(t('diff_' + q.difficulty))}</span><span class="pill">${esc(t('seconds', { n: x.response }))}</span><span class="pill" dir="ltr">+${x.points}</span></div>
    <h3>${esc(L(q.q))}</h3>
    <p>${esc(t('yourAnswer'))} <b>${x.timeout || !given ? esc(t('noAnswer')) : esc(given)}</b></p>
    <p>${esc(t('correctAnswer'))} <b>${esc(L(q.answer))}</b></p>
    <p class="subtle">${esc(L(q.explanation))}</p>
    <a href="${esc(q.source)}" target="_blank" rel="noopener noreferrer">${esc(t('source'))} ↗</a>
    <a class="report" href="${esc(reportLink(q, LANG, t))}" target="_blank" rel="noopener noreferrer">⚑ ${esc(t('report'))}</a></div>`;
}

// Test hook (read-only view of state; used by the automated browser tests).
window.__arena = {
  state: () => ({ screen: S.screen, status: S.status, mode: S.mode, sport: S.sport, index: S.index, answered: S.answered, score: S.score,
    lives: S.lives, timers: { q: !!S.timer, advance: !!S.advanceTimer, count: !!S.countTimer }, remaining: S.remaining, lang: LANG }),
  current: () => S.q && { id: S.q.id, sport: S.q.sport, baseTime: S.q.time, type: S.q.type, answer: S.q.answer, aliases: S.q.aliases, correctIndex: S.opts.findIndex(o => o.correct), time: S.qTime },
  bankSize: () => BANK.length
};

render();

</script>
</body>
</html>
